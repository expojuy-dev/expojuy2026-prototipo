<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="100%" height="100%">
  <!-- Cauchari Solar Parque Fotovoltaico Jujuy -->
  <rect width="300" height="80" fill="transparent"/>
  <g transform="translate(18, 14)">
    <!-- Sun & Photovoltaic panel angles -->
    <circle cx="26" cy="26" r="22" fill="#F59E0B" opacity="0.2"/>
    <circle cx="26" cy="26" r="16" fill="#F59E0B"/>
    <!-- Solar grid lines -->
    <path d="M14,26 L38,26 M26,14 L26,38 M18,18 L34,34 M18,34 L34,18" stroke="#FFFFFF" stroke-width="1.8"/>
  </g>
  <text x="75" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#1E293B" letter-spacing="1">CAUCHARÍ</text>
  <text x="75" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="3">SOLAR 300MW</text>
</svg>
